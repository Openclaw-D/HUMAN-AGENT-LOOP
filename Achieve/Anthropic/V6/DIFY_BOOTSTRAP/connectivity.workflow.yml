app:
  description: '仅用于1.13.2导入、输入校验和输出协议检查。没有模型调用，不产生业务判断；六角色模型流程由后续检查点接入。'
  icon: '🔎'
  icon_background: '#E5E7EB'
  mode: workflow
  name: '见微｜接入检查（无模型推理）'
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: '0.6.0'
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: start-source-check-target
        source: 'jw_start'
        sourceHandle: source
        target: 'jw_check'
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: code
      - id: check-source-end-target
        source: 'jw_check'
        sourceHandle: source
        target: 'jw_end'
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: end
    nodes:
      - id: 'jw_start'
        type: custom
        width: 244
        height: 116
        position: {x: 30, y: 180}
        positionAbsolute: {x: 30, y: 180}
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          title: '合成请求输入'
          desc: '只接收协议测试资料，不输入真实客户数据或凭证。'
          type: start
          selected: false
          variables:
            - label: '合成请求JSON'
              variable: request_json
              type: paragraph
              required: true
              max_length: 8000
              options: []
      - id: 'jw_check'
        type: custom
        width: 244
        height: 98
        position: {x: 350, y: 180}
        positionAbsolute: {x: 350, y: 180}
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          title: '确定性协议检查｜非Agent分析'
          desc: '验证请求形状并明确返回模型未配置，不伪造分析成功。'
          type: code
          selected: false
          code_language: python3
          variables:
            - variable: request_json
              value_selector: ['jw_start', 'request_json']
          outputs:
            result_json:
              type: string
              children: null
          code: |
            import json

            def main(request_json: str) -> dict:
                allowed = {"schemaVersion", "requestId", "projectId", "contextVersion", "eventType", "question", "synthetic"}
                result = {"schemaVersion": "jw-connectivity/1", "status": "invalid_input", "modelInvoked": False, "authority": "none", "analysis": None}
                try:
                    if not isinstance(request_json, str) or len(request_json) > 8000:
                        raise ValueError("size")
                    data = json.loads(request_json)
                    if not isinstance(data, dict) or set(data) != allowed:
                        raise ValueError("fields")
                    if data["schemaVersion"] != "jw-connectivity/1" or data["synthetic"] is not True:
                        raise ValueError("scope")
                    if any(not isinstance(data[k], str) or not data[k].strip() or len(data[k]) > 100 for k in ["requestId", "projectId"]):
                        raise ValueError("identity")
                    if type(data["contextVersion"]) is not int or data["contextVersion"] < 0:
                        raise ValueError("version")
                    if data["eventType"] != "connectivity_check":
                        raise ValueError("event")
                    if not isinstance(data["question"], str) or not 1 <= len(data["question"].strip()) <= 2000:
                        raise ValueError("question")
                    result.update({"status": "model_not_configured", "requestId": data["requestId"], "projectId": data["projectId"], "contextVersion": data["contextVersion"], "message": "协议检查完成；模型尚未配置，没有生成业务分析。"})
                except (ValueError, TypeError, KeyError):
                    result["message"] = "请求格式不符合合成连通测试协议。"
                return {"result_json": json.dumps(result, ensure_ascii=False)}
      - id: 'jw_end'
        type: custom
        width: 244
        height: 98
        position: {x: 670, y: 180}
        positionAbsolute: {x: 670, y: 180}
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          title: '输出接入状态（不修改业务）'
          desc: ''
          type: end
          selected: false
          outputs:
            - variable: result_json
              value_selector: ['jw_check', 'result_json']
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.85}
