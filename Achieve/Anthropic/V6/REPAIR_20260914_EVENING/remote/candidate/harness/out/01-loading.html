<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>riv3</title>
<style>html,body{margin:0;padding:0}/* C 路候选 · 远程尽调现场页样式 v3（REPAIR_20260914_EVENING/remote/candidate）。
   视觉语言对齐 se-interview.module.css（SE_FRONT_V3）：连续面板、细线图标、紧凑行、
   system-ui 字体栈；前缀 riv- 与 siv- 零冲突，可整文件并存后合并。
   布局（COMMON 20260914）：上部现场区约半屏视觉参考（左画面 + 右紧凑工具 280px），
   下部进度 → 当前操作 → 聊天；顶部不机械占 50%。
   断点：900px（桌面工具栏/手机工具行）、359px（字段纵排）；prefers-reduced-motion。 */

.rivRoot {
  --riv-bg: #f3f4f7;
  --riv-panel: #ffffff;
  --riv-band: #ebeef2;
  --riv-line: #e3e6ec;
  --riv-ink: #1b2333;
  --riv-sub: #5d6675;
  --riv-accent: #16233a;
  --riv-accent-ink: #ffffff;
  --riv-soft: #f3f5f9;
  --riv-green: #16a34a;
  --riv-green-ink: #166534;
  --riv-green-bg: #e9f6ee;
  --riv-amber: #d97706;
  --riv-amber-ink: #92400e;
  --riv-amber-bg: #fbf1e0;
  --riv-red: #dc2626;
  --riv-red-ink: #b91c1c;
  --riv-red-bg: #fdeeee;
  --riv-full-bg: #101a2c;

  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--riv-bg);
  color: var(--riv-ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.rivRoot * {
  box-sizing: border-box;
}

/* ---------- 顶部：返回 + 状态 + 静态标题（F2）+ 视图切换 ---------- */

.rivTop {
  flex: 0 0 auto;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 4px;
  background: var(--riv-panel);
  border-bottom: 1px solid var(--riv-line);
  flex-wrap: wrap;
}

.rivTopBack {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  color: var(--riv-ink);
  text-decoration: none;
}

.rivTopBack:hover,
.rivTopBack:focus-visible {
  background: var(--riv-soft);
}

.rivBadge {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--riv-soft);
  color: var(--riv-sub);
}

.rivBadge[data-state='live'] { background: var(--riv-green-bg); color: var(--riv-green-ink); }
.rivBadge[data-state='paused'] { background: var(--riv-amber-bg); color: var(--riv-amber-ink); }
.rivBadge[data-state='warn'] { background: var(--riv-amber-bg); color: var(--riv-amber-ink); }
.rivBadge[data-state='bad'] { background: var(--riv-red-bg); color: var(--riv-red-ink); }
.rivBadge[data-state='ok'] { background: var(--riv-green-bg); color: var(--riv-green-ink); }

.rivDot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--riv-green);
  flex: 0 0 auto;
}

.rivTopTitle {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rivViewToggle {
  flex: 0 0 auto;
  display: inline-flex;
  border: 1px solid var(--riv-line);
  border-radius: 9px;
  overflow: hidden;
  background: var(--riv-soft);
}

.rivViewBtn {
  border: 0;
  background: transparent;
  padding: 7px 12px;
  min-height: 34px;
  font-size: 12px;
  font-weight: 600;
  color: var(--riv-sub);
  cursor: pointer;
}

.rivViewBtn[data-active='yes'] {
  background: var(--riv-accent);
  color: var(--riv-accent-ink);
}

.rivViewBtn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.rivViewNote {
  flex: 0 0 auto;
  padding: 5px 12px;
  font-size: 12px;
  background: var(--riv-soft);
  color: var(--riv-sub);
  border-bottom: 1px solid var(--riv-line);
}

/* ---------- 未确认请求恢复条（唯一渲染点） ---------- */

.rivStatusStrip {
  flex: 0 0 auto;
  padding: 4px 8px;
  background: var(--riv-amber-bg);
  border-bottom: 1px solid var(--riv-line);
}

.rivPendingRow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--riv-amber-ink);
}

/* ---------- 上部：现场画面 + 右侧紧凑工具 ---------- */

.rivStageRow {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
  padding: 8px;
  align-items: start;
}

.rivStageCol {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rivStage {
  position: relative;
  width: 100%;
  /* 现场主体约半屏视觉参考：内容适配，不机械 50%（小屏保画面可理解面积） */
  height: clamp(220px, 40dvh, 340px);
  border-radius: 12px;
  border: 1px solid var(--riv-line);
  background: linear-gradient(160deg, #dfe4ec 0%, #cdd4e0 55%, #bfc7d6 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.rivStage[data-sim='on'] {
  background: linear-gradient(160deg, #2c3a55 0%, #22304a 55%, #1a2538 100%);
}

.rivStage[data-full='yes'] {
  height: auto;
  min-height: 46dvh;
  flex: 1 1 auto;
}

.rivStageTop {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  z-index: 2;
}

.rivSimTag {
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.86);
  color: var(--riv-sub);
}

.rivSimTag[data-sim='on'] {
  background: rgba(16, 26, 44, 0.72);
  color: #dbe4f2;
}

.rivStageAvatar {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #46536b;
  min-height: 0;
}

.rivStage[data-sim='on'] .rivStageAvatar {
  color: #aeb9cf;
}

.rivStageQuestion {
  position: relative;
  z-index: 2;
  margin: 0;
  padding: 9px 12px;
  background: rgba(255, 255, 255, 0.94);
  border-top: 1px solid var(--riv-line);
  font-size: 13.5px;
  font-weight: 600;
}

.rivStageQuestionText {
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rivStageQuestionLabel {
  font-size: 11px;
  font-weight: 600;
  color: var(--riv-sub);
}

.rivStageCtrl {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.rivToggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--riv-sub);
  min-height: 34px;
}

.rivStageConn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--riv-sub);
}

.rivStageDetail {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 10px;
  background: var(--riv-panel);
  border: 1px solid var(--riv-line);
  border-radius: 10px;
}

.rivStageBasis {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-sub);
}

.rivStageRisk {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-amber-ink);
}

.rivVoiceNote {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 10px;
  background: var(--riv-soft);
  border: 1px dashed var(--riv-line);
  border-radius: 10px;
  align-items: flex-start;
}

.rivVoiceNote .rivNote {
  margin: 0;
}

/* ---------- 右侧紧凑工具（桌面纵栏 280px；手机为工具行） ---------- */

.rivToolCol {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivToolBtns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.rivToolBtn {
  flex: 1 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 10px;
  background: var(--riv-panel);
  color: var(--riv-ink);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.rivToolBtn[data-active='yes'] {
  background: var(--riv-accent);
  border-color: var(--riv-accent);
  color: var(--riv-accent-ink);
}

.rivToolPanel {
  background: var(--riv-panel);
  border: 1px solid var(--riv-line);
  border-radius: 10px;
  padding: 10px;
}

.rivToolPanelBody {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivToolDomain {
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  padding: 7px 9px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rivToolDomainHead {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
}

.rivToolDomain[data-state='done'] .rivDot { background: var(--riv-green); }
.rivToolDomain[data-state='current'] .rivDot { background: var(--riv-amber); }

.rivToolTip {
  margin: 0;
  font-size: 12px;
  color: var(--riv-sub);
  padding-left: 13px;
}

.rivToolTip[data-level='warn'],
.rivToolTip[data-level='risk'] {
  color: var(--riv-amber-ink);
}

.rivToolTip[data-level='risk'] {
  font-weight: 600;
}

.rivAttendList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rivAttendItem {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
  border-bottom: 1px dashed var(--riv-line);
  padding-bottom: 5px;
}

.rivAttendName { font-size: 13px; }
.rivAttendRole { color: var(--riv-sub); font-size: 12px; }
.rivAttendState { color: var(--riv-sub); font-size: 12px; margin-left: auto; }

/* ---------- 下部 1：进度（只读汇总） ---------- */

.rivProgress {
  flex: 0 0 auto;
  margin: 0 8px;
  padding: 8px 10px;
  background: var(--riv-panel);
  border: 1px solid var(--riv-line);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rivProgressTrack {
  height: 6px;
  border-radius: 999px;
  background: var(--riv-band);
  overflow: hidden;
}

.rivProgressTrack span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--riv-green);
  transition: width 0.2s ease;
}

.rivProgressText {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-sub);
}

.rivProgressWarn {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-amber-ink);
}

/* ---------- 下部 2：当前操作（操作坞） ---------- */

.rivDock {
  flex: 0 0 auto;
  margin: 8px;
  padding: 10px;
  background: var(--riv-panel);
  border: 1px solid var(--riv-line);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivDockLabelRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.rivFieldLabel {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-sub);
}

.rivVoiceBtn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--riv-line);
  background: var(--riv-soft);
  border-radius: 999px;
  padding: 6px 11px;
  min-height: 34px;
  font-size: 12px;
  color: var(--riv-sub);
  cursor: pointer;
}

.rivTextarea {
  width: 100%;
  resize: vertical;
  min-height: 56px;
  padding: 8px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 9px;
  font: inherit;
  color: var(--riv-ink);
  background: var(--riv-soft);
}

.rivTextarea:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 1px;
}

/* F1：关键字段核对默认折叠为一行开关 */
.rivFieldsToggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  padding: 8px 11px;
  border: 1px dashed var(--riv-line);
  border-radius: 9px;
  background: transparent;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-sub);
  cursor: pointer;
}

.rivFieldsToggle[aria-expanded='true'] .rivChevron {
  transform: rotate(90deg);
}

.rivChevron {
  flex: 0 0 auto;
  transition: transform 0.15s ease;
}

.rivFields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.rivField {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12.5px;
  color: var(--riv-sub);
}

.rivInput {
  width: 100%;
  min-height: 40px;
  padding: 7px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 9px;
  font: inherit;
  color: var(--riv-ink);
  background: var(--riv-soft);
}

.rivActions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.rivPrimary,
.rivSecondary {
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.rivPrimary {
  border: 0;
  background: var(--riv-accent);
  color: var(--riv-accent-ink);
}

.rivPrimary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.rivSecondary {
  border: 1px solid var(--riv-line);
  background: var(--riv-panel);
  color: var(--riv-ink);
}

.rivSecondary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.rivBtnRow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.rivBtnSmall {
  min-height: 36px;
  padding: 6px 11px;
  border: 1px solid var(--riv-line);
  border-radius: 9px;
  background: var(--riv-panel);
  color: var(--riv-ink);
  font-size: 12.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.rivBtnSmall:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.rivFeedback {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rivFeedback:empty {
  display: none;
}

.rivNotice {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-green-ink);
}

.rivError {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-red-ink);
}

/* ---------- 下部 3：聊天（访谈对话流） ---------- */

.rivChat {
  flex: 0 0 auto;
  margin: 0 8px 8px;
  padding: 10px;
  background: var(--riv-panel);
  border: 1px solid var(--riv-line);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivSecKicker {
  margin: 0;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--riv-sub);
}

.rivChatFeed {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivChatGroup {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.rivChatKind {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--riv-sub);
}

.rivChatGroup[data-kind='model_real'] .rivChatKind,
.rivChatGroup[data-kind='model_simulation'] .rivChatKind {
  color: var(--riv-amber-ink);
}

.rivChatBubbles {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-left: 10px;
  border-left: 2px solid var(--riv-band);
}

.rivChatText {
  margin: 0;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.rivChatTime {
  font-size: 11px;
  color: var(--riv-sub);
}

.rivHistoryToggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 9px;
  background: var(--riv-soft);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-sub);
  cursor: pointer;
}

.rivHistoryToggle[aria-expanded='true'] .rivChevron {
  transform: rotate(90deg);
}

.rivHistoryBody {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivQuestionList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.rivQuestionItem {
  border: 1px solid var(--riv-line);
  border-radius: 9px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rivQuestionText {
  margin: 0;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-sub);
}

.rivReviewList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rivReviewItem {
  font-size: 12px;
  color: var(--riv-sub);
  border-top: 1px dashed var(--riv-line);
  padding-top: 4px;
}

/* ---------- 折叠区（历史/演示设置） ---------- */

.rivDetails {
  border: 1px solid var(--riv-line);
  border-radius: 10px;
  background: var(--riv-panel);
}

.rivDetails > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.rivDetails > summary::-webkit-details-marker {
  display: none;
}

.rivDetails > summary:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: -2px;
}

.rivSummaryLead {
  flex: 0 0 auto;
  color: var(--riv-sub);
}

.rivSummaryTxt {
  flex: 1 1 auto;
  min-width: 0;
}

.rivDetails[open] > summary .rivChevron {
  transform: rotate(90deg);
}

.rivDetailsBody {
  padding: 0 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rivEvidenceList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rivEvidenceItem {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: space-between;
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  padding: 5px 8px;
}

.rivEvidenceBtn {
  border: 0;
  background: transparent;
  padding: 4px 2px;
  min-height: 32px;
  font-size: 12.5px;
  color: var(--riv-ink);
  cursor: pointer;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.rivEvidenceVer {
  font-size: 11px;
  color: var(--riv-sub);
  border: 1px solid var(--riv-line);
  border-radius: 999px;
  padding: 0 6px;
}

.rivCalcList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rivCalcItem {
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 12.5px;
}

.rivCalcItem b {
  display: block;
  margin-bottom: 3px;
}

.rivCalcItem[data-status='refused'],
.rivCalcItem[data-stale='yes'] {
  border-color: var(--riv-amber);
  background: var(--riv-amber-bg);
  color: var(--riv-amber-ink);
}

/* ---------- 转写列表 ---------- */

.rivTranscriptList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 220px;
  overflow-y: auto;
}

.rivTranscriptItem {
  display: flex;
  gap: 8px;
  align-items: baseline;
  font-size: 12.5px;
}

.rivTranscriptTime {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--riv-sub);
  font-variant-numeric: tabular-nums;
}

.rivTranscriptWho {
  flex: 0 0 auto;
  font-weight: 600;
  font-size: 12px;
  color: var(--riv-sub);
