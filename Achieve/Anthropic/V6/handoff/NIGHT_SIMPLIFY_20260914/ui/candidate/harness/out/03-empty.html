<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>riv-harness</title><style>
html,body{margin:0;padding:0}
/* 任务B 候选 · 远程尽调页样式（NIGHT_SIMPLIFY_20260914/ui/candidate）
   视觉语言对齐 se-interview.module.css：一块连续面板 + 4px 分隔带、细线图标、
   紧凑行、system-ui、无大卡片大留白、无持续动画。类名前缀 riv-，不与 siv-/现有类冲突。
   布局差异：现场画面区为页内主体（16:9）；桌面 ≥900px 右侧四域栏；手机四域手风琴。 */

.rivRoot {
  --riv-bg: #f3f4f7;
  --riv-panel: #ffffff;
  --riv-band: #ebeef2;
  --riv-line: #e3e6ec;
  --riv-ink: #1b2333;
  --riv-sub: #5d6675;
  --riv-soft: #f3f5f9;
  --riv-accent: #16233a;
  --riv-accent-ink: #ffffff;
  --riv-green: #16a34a;
  --riv-green-ink: #166534;
  --riv-green-bg: #e9f6ee;
  --riv-amber: #d97706;
  --riv-amber-ink: #92400e;
  --riv-amber-bg: #fbf1e0;
  --riv-red: #dc2626;
  --riv-red-ink: #b91c1c;
  --riv-red-bg: #fdeeee;
  --riv-full-bg: #101a2c;

  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--riv-bg);
  color: var(--riv-ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.rivRoot * {
  box-sizing: border-box;
}

/* ---------- 顶部 ---------- */

.rivTop {
  flex: 0 0 auto;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 4px;
  background: var(--riv-panel);
  border-bottom: 1px solid var(--riv-line);
}

.rivTopBack {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  color: var(--riv-ink);
  text-decoration: none;
}

.rivTopBack:hover,
.rivTopBack:focus-visible {
  background: var(--riv-soft);
}

.rivTopTitle {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 600;
}

/* ---------- 徽章 / 点 ---------- */

.rivBadge {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--riv-soft);
  color: var(--riv-sub);
}

.rivBadge[data-state='live'],
.rivBadge[data-state='ok'] {
  background: var(--riv-green-bg);
  color: var(--riv-green-ink);
}

.rivBadge[data-state='paused'],
.rivBadge[data-state='warn'] {
  background: var(--riv-amber-bg);
  color: var(--riv-amber-ink);
}

.rivBadge[data-state='bad'] {
  background: var(--riv-red-bg);
  color: var(--riv-red-ink);
}

.rivDot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--riv-green);
  flex: 0 0 auto;
}

/* ---------- 恢复条（唯一渲染点） ---------- */

.rivStatusStrip {
  flex: 0 0 auto;
  border-bottom: 1px solid var(--riv-line);
  background: var(--riv-panel);
}

.rivPendingRow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  font-size: 13px;
  color: var(--riv-amber-ink);
}

/* ---------- 主区：左主列 + 右四域栏 ---------- */

.rivMain {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column; /* 手机：单列，四域栏在主列下方 */
}

.rivScroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 6px;
}

.rivPanel {
  background: var(--riv-panel);
  border: 1px solid var(--riv-line);
  border-radius: 10px;
  overflow: hidden;
}

.rivSection {
  padding: 10px 12px;
}

.rivSection + .rivSection,
.rivDetails + .rivSection,
.rivSection + .rivDetails,
.rivDetails + .rivDetails {
  border-top: 4px solid var(--riv-band);
}

.rivSecKicker {
  margin: 0 0 6px;
  font-size: 12px;
  color: var(--riv-sub);
  font-weight: 600;
}

.rivQ {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 650;
}

.rivNote {
  margin: 4px 0;
  font-size: 12.5px;
  color: var(--riv-sub);
}

.rivFooter {
  margin: 0;
  padding: 8px 12px;
  border-top: 4px solid var(--riv-band);
  font-size: 11.5px;
  color: var(--riv-sub);
}

/* ---------- 现场画面区 ---------- */

.rivStageWrap {
  padding: 10px 12px;
}

.rivStage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: 46vh;
  border-radius: 8px;
  background: var(--riv-full-bg);
  color: #e6ebf4;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.rivStageTop {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
}

.rivSimTag {
  font-size: 12px;
  color: #aab6cc;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rivSimTag[data-sim='on'] {
  color: #ffd98a;
}

.rivStageAvatar {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #8fa0bd;
}

.rivStage[data-sim='on'] .rivStageAvatar {
  color: #c9d6ec;
}

.rivStageQuestion {
  margin: 0;
  padding: 8px 10px;
  background: rgba(16, 26, 44, 0.86);
  font-size: 13px;
}

.rivStageQuestionText {
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.rivStageBasis {
  margin: 4px 0 0;
  font-size: 12px;
  color: #aab6cc;
}

.rivStageRisk {
  margin: 2px 0 0;
  font-size: 12px;
  color: #ffd98a;
}

.rivStageQuestionLabel {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  font-size: 11px;
  color: #cdd9ec;
}

.rivStageControls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.rivToggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  font-size: 13px;
  color: var(--riv-sub);
  cursor: pointer;
}

/* ---------- 折叠区（记录层） ---------- */

.rivDetails {
  border-top: 4px solid var(--riv-band);
}

.rivDetails > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13.5px;
}

.rivDetails > summary::-webkit-details-marker {
  display: none;
}

.rivDetails > summary:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: -2px;
  border-radius: 8px;
}

.rivSummaryLead {
  flex: 0 0 auto;
  color: var(--riv-sub);
}

.rivSummaryTxt {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rivChevron {
  flex: 0 0 auto;
  color: var(--riv-sub);
  transition: transform 0.15s ease;
}

.rivDetails[open] > summary .rivChevron,
.rivDomainHead[aria-expanded='true'] .rivChevron {
  transform: rotate(90deg);
}

.rivDetailsBody {
  padding: 4px 12px 10px;
  border-top: 1px solid var(--riv-line);
}

.rivBtnRow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 6px 0;
}

.rivEvidenceList,
.rivQuestionList,
.rivReviewList,
.rivTranscriptList,
.rivChatList,
.rivCapsList {
  list-style: none;
  margin: 0;
  padding: 0;
}

.rivEvidenceItem {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  border-bottom: 1px solid var(--riv-line);
}

.rivEvidenceBtn {
  flex: 1 1 auto;
  min-height: 36px;
  text-align: left;
  border: 0;
  background: none;
  color: var(--riv-ink);
  font: inherit;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rivEvidenceBtn:hover,
.rivEvidenceBtn:focus-visible {
  background: var(--riv-soft);
}

.rivQuestionItem {
  padding: 8px 0;
  border-bottom: 1px solid var(--riv-line);
}

.rivQuestionItem[data-expired='yes'] {
  color: var(--riv-sub);
}

.rivQuestionText {
  margin: 0 0 4px;
  font-weight: 600;
  font-size: 13.5px;
}

.rivReply {
  margin: 2px 0;
  font-size: 13px;
  display: flex;
  gap: 6px;
  align-items: baseline;
  flex-wrap: wrap;
}

.rivReplyKind {
  flex: 0 0 auto;
  font-size: 11.5px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--riv-soft);
  color: var(--riv-sub);
}

.rivReply[data-kind='model_simulation'] .rivReplyKind,
.rivReply[data-kind='model_real'] .rivReplyKind {
  background: var(--riv-amber-bg);
  color: var(--riv-amber-ink);
}

.rivReviewItem {
  padding: 4px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--riv-line);
}

.rivTranscriptItem {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 3px 0;
  font-size: 12.5px;
  flex-wrap: wrap;
}

.rivTranscriptTime {
  flex: 0 0 auto;
  color: var(--riv-sub);
  font-variant-numeric: tabular-nums;
}

.rivTranscriptWho {
  flex: 0 0 auto;
  font-weight: 600;
}

.rivTranscriptText {
  min-width: 0;
  overflow-wrap: anywhere;
}

/* ---------- 内部交流 ---------- */

.rivChat {
  border-top: 4px solid var(--riv-band);
  padding: 10px 12px;
}

.rivChatItem {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 3px 0;
  font-size: 13px;
  flex-wrap: wrap;
}

.rivChatWho {
  flex: 0 0 auto;
  font-weight: 600;
}

.rivChatKind {
  flex: 0 0 auto;
  font-size: 11.5px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--riv-soft);
  color: var(--riv-sub);
}

.rivChatText {
  flex: 1 1 12em;
  min-width: 0;
  overflow-wrap: anywhere;
}

.rivChatTime {
  flex: 0 0 auto;
  color: var(--riv-sub);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.rivChatForm {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}

.rivChatInput {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 40px;
  padding: 6px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  font: inherit;
  color: var(--riv-ink);
  background: var(--riv-panel);
}

.rivChatInput:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 1px;
}

/* ---------- 四域提示栏 ---------- */

.rivDomainCol {
  flex: 0 0 auto;
  border-top: 1px solid var(--riv-line);
  background: var(--riv-panel);
  padding: 4px 6px 6px;
}

.rivDomainHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 6px;
}

.rivDomainToggle {
  flex: 0 0 auto;
  min-height: 36px;
  padding: 4px 11px;
  border-radius: 8px;
  border: 1px solid var(--riv-line);
  background: var(--riv-panel);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-ink);
  cursor: pointer;
}

.rivDomainToggle:hover,
.rivDomainToggle:focus-visible {
  background: var(--riv-soft);
}

.rivDomainToggle:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 1px;
}

/* 手机默认：整列收起（仅一行头部），展开后域内再按手风琴收缩 */
.rivDomainCol[data-open='false'] .rivDomainList {
  display: none;
}

.rivDomainList {
  display: flex;
  flex-direction: column;
}

.rivDomainItem {
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  margin: 4px 6px;
  background: var(--riv-panel);
}

.rivDomainHead {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 6px 10px;
  border: 0;
  background: none;
  font: inherit;
  color: var(--riv-ink);
  cursor: pointer;
  text-align: left;
  border-radius: 8px;
}

.rivDomainHead:focus-visible,
.rivBtnSmall:focus-visible,
.rivBtnSmall:hover,
.rivEvidenceBtn:focus-visible {
  background: var(--riv-soft);
}

.rivDomainHead:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: -2px;
}

.rivDomainName {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 600;
}

.rivDomainName[data-state='done'] {
  color: var(--riv-green-ink);
}

.rivDomainName[data-state='current'] {
  color: var(--riv-accent);
}

.rivDomainCount {
  flex: 1 1 auto;
  text-align: right;
  font-size: 12px;
  color: var(--riv-sub);
}

/* 手机默认：手风琴（未展开的域收起条目） */
.rivDomainHead[aria-expanded='false'] + .rivDomainTips {
  display: none;
}

.rivDomainTips {
  list-style: none;
  margin: 0;
  padding: 0 10px 8px;
}

.rivDomainTip {
  padding: 5px 8px;
  margin-top: 4px;
  border-radius: 8px;
  background: var(--riv-soft);
  font-size: 12.5px;
  overflow-wrap: anywhere;
}

.rivDomainTip[data-level='warn'] {
  background: var(--riv-amber-bg);
  color: var(--riv-amber-ink);
}

.rivDomainTip[data-level='risk'] {
  background: var(--riv-red-bg);
  color: var(--riv-red-ink);
}

/* 桌面 ≥900px：右侧固定四域栏，整列与域内条目全部展开（隐藏手机折叠开关） */
@media (min-width: 900px) {
  .rivMain {
    flex-direction: row;
  }

  .rivScroll {
    flex: 1 1 auto;
  }

  .rivDomainCol {
    flex: 0 0 248px;
    border-top: 0;
    border-left: 1px solid var(--riv-line);
    overflow-y: auto;
    align-self: stretch;
  }

  .rivDomainToggle {
    display: none;
  }

  .rivDomainCol[data-open='false'] .rivDomainList {
    display: flex;
  }

  .rivDomainHead[aria-expanded='false'] + .rivDomainTips {
    display: block;
  }

  .rivDomainHead .rivChevron {
    display: none;
  }
}

/* ---------- 操作坞 ---------- */

.rivDock {
  flex: 0 0 auto;
  border-top: 1px solid var(--riv-line);
  background: var(--riv-panel);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 44vh;
  overflow-y: auto;
}

.rivFieldLabel {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-sub);
}

/* 关键字段核对折叠开关（低频纠正输入，默认收起以压缩手机操作坞高度） */
.rivFieldsToggle {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 4px 10px;
  border: 1px dashed var(--riv-line);
  border-radius: 8px;
  background: var(--riv-panel);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--riv-sub);
  cursor: pointer;
  text-align: left;
}

.rivFieldsToggle .rivChevron {
  margin-left: auto;
}

.rivFieldsToggle[aria-expanded='true'] .rivChevron {
  transform: rotate(90deg);
}

.rivFieldsToggle:hover,
.rivFieldsToggle:focus-visible {
  background: var(--riv-soft);
}

.rivFieldsToggle:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 1px;
}

.rivTextarea {
  width: 100%;
  min-height: 52px;
  resize: vertical;
  padding: 8px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  font: inherit;
  color: var(--riv-ink);
  background: var(--riv-panel);
}

.rivTextarea:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 1px;
}

.rivFields {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.rivField {
  flex: 1 1 10em;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 12.5px;
  color: var(--riv-sub);
}

.rivInput {
  min-height: 40px;
  padding: 6px 10px;
  border: 1px solid var(--riv-line);
  border-radius: 8px;
  font: inherit;
  color: var(--riv-ink);
  background: var(--riv-panel);
}

.rivInput:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 1px;
}

.rivActions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.rivPrimary,
.rivSecondary,
.rivBtnSmall {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 9px;
  border: 1px solid transparent;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.rivPrimary {
  background: var(--riv-accent);
  color: var(--riv-accent-ink);
}

.rivPrimary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.rivSecondary {
  background: var(--riv-panel);
  border-color: var(--riv-line);
  color: var(--riv-ink);
}

.rivBtnSmall {
  min-height: 36px;
  padding: 5px 11px;
  font-size: 13px;
  font-weight: 600;
  background: var(--riv-panel);
  border-color: var(--riv-line);
  color: var(--riv-ink);
}

.rivPrimary:focus-visible,
.rivSecondary:focus-visible {
  outline: 2px solid var(--riv-accent);
  outline-offset: 2px;
}

.rivSecondary:disabled,
.rivBtnSmall:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.rivFeedback {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rivNotice {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-green-ink);
}

.rivError {
  margin: 0;
  font-size: 12.5px;
  color: var(--riv-red-ink);
}

/* ---------- 放大覆盖层 ---------- */

.rivFull {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--riv-full-bg);
  color: #e6ebf4;
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 10px;
}

.rivFull .rivStage {
  flex: 1 1 auto;
  max-height: none;
}

.rivFullControls {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.rivFull .rivPrimary {
  background: #24395c;
  color: #e6ebf4;
}

/* ---------- 辅助 ---------- */

.rivSrOnly {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* 超窄屏：字段纵排，避免挤压 */
@media (max-width: 359px) {
  .rivField {
    flex: 1 1 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .rivChevron {
    transition: none;
  }
}
