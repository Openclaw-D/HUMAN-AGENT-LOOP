<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>见微 V3</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" aria-label="项目与流程位置">
        <div class="brand-block">
          <p class="project-name">见微 V3</p>
          <p class="project-subtitle">融资租赁合成事项</p>
        </div>
        <section class="rail-section" aria-labelledby="stage-slots-title">
          <div class="section-heading">
            <h2 id="stage-slots-title">当前流程位置</h2>
            <span class="section-count">5</span>
          </div>
          <div id="stage-slots" class="stage-slots" aria-live="polite">
            <article class="state-card">
              <h3>加载中</h3>
              <p>正在准备流程位置。</p>
            </article>
          </div>
        </section>
      </aside>
      <main id="workspace-root" class="workspace" aria-label="主工作区">
        <nav class="stage-navigation" aria-label="顶层板块">
          <button class="stage-button" type="button" data-stage="policy"></button>
          <button class="stage-button" type="button" data-stage="credit"></button>
          <button class="stage-button" type="button" data-stage="commerce"></button>
          <button class="stage-button" type="button" data-stage="asset"></button>
        </nav>
        <section class="workspace-view" aria-live="polite">
          <div class="workspace-summary">
            <p id="workspace-status">板块信息准备中。</p>
          </div>
          <div class="workspace-placeholder">
            <h2>板块工作区</h2>
            <p>当前版本仅开放板块切换；详细工作区将在后续版本提供。</p>
          </div>
        </section>
      </main>
      <aside id="chat-panel" class="right-rail" aria-label="事项与对话">
        <section class="panel-card">
          <h2>事项操作</h2>
          <p class="empty-note">本检查点暂不开放事项操作。</p>
        </section>
        <section class="panel-card chat-panel-card">
          <h2>Chatbox</h2>
          <p class="empty-note">对话功能暂未开放。</p>
        </section>
      </aside>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
