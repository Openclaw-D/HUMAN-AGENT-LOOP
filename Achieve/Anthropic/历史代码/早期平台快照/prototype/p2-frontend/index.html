<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>见微｜连续协作运行时</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell" id="app" aria-busy="true">
    <header class="topbar">
      <a class="brand" href="#" aria-label="见微首页">
        <strong>见微</strong>
        <span>连续协作运行时</span>
      </a>

      <section class="case-heading" aria-labelledby="caseTitle">
        <label class="sr-only" for="caseSelect">选择协同事项</label>
        <select id="caseSelect" aria-label="选择协同事项"></select>
        <div>
          <h1 id="caseTitle">状态载入中</h1>
          <p id="goalLine">正在核验权威事件链</p>
        </div>
      </section>

      <nav class="view-tabs" aria-label="协同视图">
        <button type="button" data-view="relation" aria-pressed="true">
          <span>关系</span><small>谁在接力</small>
        </button>
        <button type="button" data-view="progress" aria-pressed="false">
          <span>推进</span><small>走到哪里</small>
        </button>
        <button type="button" data-view="responsibility" aria-pressed="false">
          <span>责任</span><small>谁能决定</small>
        </button>
      </nav>

      <div class="top-actions">
        <span class="mode-badge" id="modeBadge">模式核验中</span>
        <button class="evidence-button" id="auditButton" type="button">
          <span>证据链</span>
          <strong id="eventCount">—</strong>
        </button>
      </div>
    </header>

    <section class="vitals" id="vitals" aria-label="事项体征"></section>

    <section class="workspace" id="workspace" hidden>
      <section class="canvas-panel" aria-label="协同主画布">
        <header class="canvas-heading">
          <div>
            <p class="eyebrow" id="viewKicker">当前协同态势</p>
            <h2 id="viewTitle">让接力关系一眼可见</h2>
          </div>
          <p id="viewSummary">所有视图来自同一事件投影。</p>
        </header>
        <div class="view-root" id="viewRoot" tabindex="0"></div>
      </section>

      <aside class="action-rail" aria-label="当前行动台">
        <section class="next-action" id="nextAction"></section>
        <button class="decision-glance" id="decisionGlance" type="button"></button>
        <button class="context-glance" id="contextGlance" type="button"></button>
        <p class="projection-stamp" id="projectionStamp"></p>
      </aside>
    </section>

    <section class="failure" id="failure" hidden aria-live="assertive">
      <p class="eyebrow">FAIL CLOSED</p>
      <h1>状态待核验</h1>
      <p id="failureMessage">没有通过权威事件链校验，工作台不会使用示例状态代替。</p>
      <button type="button" id="retryButton">重新核验</button>
    </section>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="detail-drawer" id="detailDrawer" aria-label="事项详情" aria-hidden="true">
      <header>
        <div>
          <p class="eyebrow" id="drawerKicker">详情</p>
          <h2 id="drawerTitle">协同事项</h2>
        </div>
        <button type="button" id="drawerClose" aria-label="关闭详情">关闭</button>
      </header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <div class="busy-layer" id="busyLayer" hidden aria-live="polite">
      <span class="busy-mark" aria-hidden="true"></span>
      <strong id="busyText">正在写入事件链</strong>
      <small>刷新不会制造第二次业务动作</small>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
