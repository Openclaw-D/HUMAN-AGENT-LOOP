<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>见微-人机协同平台 · 第一阶段</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overrides.css">
</head>
<body>
  <main class="app-shell" aria-label="见微人机协同工作台">
    <header class="topbar">
      <div class="brand"><strong>见微</strong><span>人机协同平台</span></div>
      <label>场景<select id="scenarioSelect" aria-label="选择协同场景"></select></label>
      <label>协同事项<select id="workSelect" aria-label="选择协同事项"></select></label>
      <nav class="view-tabs" aria-label="选择工作视图">
        <button type="button" data-view="关系" aria-label="切换到关系视图">关系</button>
        <button type="button" data-view="进度" aria-label="切换到进度视图">进度</button>
        <button type="button" data-view="矩阵" aria-label="切换到矩阵视图">矩阵</button>
      </nav>
      <div class="authority-status" id="authorityStatus" aria-label="权威状态"></div>
    </header>
    <section class="status-strip" id="statusStrip" aria-label="当前协同状态"></section>
    <section class="workspace" id="workspace" hidden>
      <section class="canvas" aria-label="协同主画布">
        <div class="canvas-heading"><div><p class="eyebrow" id="canvasKicker"></p><h1 id="canvasTitle"></h1></div><p id="canvasMeta"></p></div>
        <div id="viewRoot" class="view-root"></div>
      </section>
      <aside class="continuation" aria-label="聊天与接续台">
        <header class="continuation-head"><button type="button" id="returnAll" hidden>返回全部</button><p class="eyebrow">聊天与接续</p><h2 id="focusTitle"></h2><p id="focusMeta"></p></header>
        <div class="continuation-body" id="continuationBody"></div>
        <form class="composer" id="composer"><label for="messageInput">普通消息</label><div><input id="messageInput" aria-label="输入普通消息" placeholder="补充说明，不会触发智能体"><button type="submit">发送消息</button></div></form>
      </aside>
    </section>
    <section id="failure" class="failure" hidden aria-live="assertive"><h1>状态待核验</h1><p id="failureText"></p><button type="button" id="refreshButton">刷新状态</button></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
