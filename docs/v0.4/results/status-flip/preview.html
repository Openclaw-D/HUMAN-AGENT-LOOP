<meta charset="utf-8"><title>状态翻片独立检查</title><style>.tk-status-scene { position:relative; display:inline-flex; align-items:center; justify-content:center; flex:none; isolation:isolate; perspective:520px; }
.tk-status-object { position:relative; z-index:1; width:100%; height:100%; object-fit:contain; pointer-events:none; }
.tk-status-object.wrench { transform-origin:83% 20%; animation:tk-wrench-working 1.65s ease-in-out infinite; }
.tk-status-bolt { position:absolute; left:74%; top:11%; width:18%; height:18%; background:linear-gradient(130deg,#ecf4f8,#738e9f); clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); box-shadow:inset 0 0 0 2px #8499a6; }
.tk-status-bolt::after { content:''; position:absolute; inset:30%; border:1px solid #627a8a; border-radius:50%; }
.tk-status-flipper { position:absolute; inset:0; transform-origin:50% 50%; transform-style:preserve-3d; animation:tk-status-flip 720ms cubic-bezier(.4,0,.2,1) both; }
.tk-status-face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.tk-status-front { transform:rotateX(0deg); }
.tk-status-back { transform:rotateX(180deg); }
.tk-status-scene.is-flip .tk-status-object { animation:none; }
.tk-status-legend .tk-status-object.wrench,.tk-flow-legend .tk-status-object.wrench,.tk-status-scene.still * { animation:none; }
@keyframes tk-status-flip { from {transform:rotateX(0deg)} to {transform:rotateX(180deg)} }
@keyframes tk-wrench-working { 0%,15%,100% {transform:rotate(0)} 58%,72% {transform:rotate(-24deg)} }
@media (prefers-reduced-motion:reduce) {
  .tk-status-scene * { animation:none!important; }
  .tk-status-flipper { transform:none; }
  .tk-status-front { display:none; }
  .tk-status-back { transform:none; }
}
